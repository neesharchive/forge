name: CI
on: [push, pull_request]
jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: alire-project/setup-alire@v4
        with:
          # Alire 2.0.2's default index cannot resolve GNATprove 16.1.0.
          version: '2.1.1'
          # Match the verified local toolchain; GNAT 14 emits duplicate
          # LC_RPATH entries rejected by current macOS dyld.
          toolchain: gnat_native=16.1.0 gprbuild=26.0.1
      - name: Proof engine runtime on macOS
        if: runner.os == 'macOS'
        run: brew install gmp
      - name: Select required macOS 15 SDK
        if: runner.os == 'macOS'
        env:
          DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
        run: |
          sdk_path="$(xcrun --sdk macosx --show-sdk-path)"
          sdk_version="$(xcrun --sdk macosx --show-sdk-version)"
          case "$sdk_version" in
            15.*) ;;
            *) echo "Expected macOS 15 SDK, got $sdk_version ($sdk_path)" >&2; exit 1 ;;
          esac
          test -d "$sdk_path"
          echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
          echo "SDKROOT=$sdk_path" >> "$GITHUB_ENV"
          echo "Using macOS SDK $sdk_version at $sdk_path"
      - name: Report verification toolchain
        run: |
          alr --version
          alr toolchain
          alr -n exec -- gnatprove --version
      - name: Build library
        run: alr -n build
      - name: Ada regression tests
        working-directory: tests
        run: |
          alr -n build
          ./bin/tests
      - name: CLI build
        working-directory: cli
        run: alr -n build
      - name: Independent OBJ and document acceptance
        run: |
          python3 tests/integration.py
          python3 tests/fixed_point.py
      - name: Full SPARK flow analysis
        run: alr -n exec -- gnatprove -P forge.gpr --mode=flow --checks-as-errors=on
      - name: SPARK arithmetic, model and history proofs
        run: >-
          alr -n exec -- gnatprove -P forge.gpr --mode=prove --level=2 -f
          --checks-as-errors=on -u forge-fixed.adb forge-grid.adb forge-model.adb forge-numeric.ads forge-history.adb
      - name: Retain proof evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spark-${{ matrix.os }}
          path: obj/gnatprove/gnatprove.out
